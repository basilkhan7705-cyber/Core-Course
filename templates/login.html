
{% extends "base.html" %}
{% block title %}Admin Login — {{ portfolio_name }}{% endblock %}
{% block content %}
<section class="auth-section container">
  <form class="auth-card" method="post">
    <span class="section-index">PRIVATE AREA</span>
    <h1>Welcome <span class="gradient-text">back.</span></h1>
    <p>Sign in to manage your portfolio projects and view messages.</p>
    <label>Username<input name="username" required autocomplete="username" maxlength="120"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="button button-primary full-button" type="submit">Sign in <span>↗</span></button>
    <a class="text-link" href="{{ url_for('home') }}">← Back to portfolio</a>
  </form>
</section>
{% endblock %}
