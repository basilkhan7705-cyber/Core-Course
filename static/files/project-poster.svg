<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title description">
  <title id="title">Student Portfolio — Project Poster</title>
  <desc id="description">A project poster for a responsive Flask portfolio website with project management, résumé download, and a contact form.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1929"/>
      <stop offset="1" stop-color="#101019"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#aaa" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="#09090f"/>
  <rect width="900" height="1200" fill="url(#dots)"/>
  <circle cx="790" cy="210" r="330" fill="url(#glow)"/>
  <circle cx="100" cy="870" r="300" fill="url(#glow)" opacity=".55"/>
  <rect x="28" y="28" width="844" height="1144" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="68" y="62" width="42" height="42" rx="13" fill="url(#accent)"/>
    <text x="89" y="91" text-anchor="middle" font-size="24" font-weight="700" fill="#171020">A.</text>
    <text x="124" y="79" fill="#f2f0fa" font-size="15" font-weight="700" letter-spacing="1.5">STUDENT PORTFOLIO</text>
    <text x="124" y="99" fill="#9b99ad" font-size="10" letter-spacing="2">WEB DEVELOPMENT PROJECT</text>
    <rect x="682" y="68" width="150" height="30" rx="15" fill="#86efac" fill-opacity=".08" stroke="#86efac" stroke-opacity=".35"/>
    <circle cx="700" cy="83" r="4" fill="#86efac"/>
    <text x="712" y="87" fill="#b9f5ca" font-size="10" letter-spacing="1.5">LIVE ON VERCEL</text>

    <text x="68" y="174" fill="#9b99ad" font-size="11" letter-spacing="3">A PERSONAL SPACE FOR</text>
    <text x="64" y="244" fill="#f2f0fa" font-size="57" font-weight="700" letter-spacing="-2">Ideas, work,</text>
    <text x="64" y="308" fill="url(#accent)" font-size="57" font-weight="700" letter-spacing="-2">and what’s next.</text>
    <text x="68" y="346" fill="#b5b2c5" font-size="15">A responsive portfolio to showcase projects, share a résumé,</text>
    <text x="68" y="369" fill="#b5b2c5" font-size="15">and make it easy to get in touch.</text>

    <rect x="68" y="407" width="764" height="318" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".13"/>
    <path d="M68 457h764" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="96" cy="432" r="5" fill="#f0abfc" opacity=".8"/>
    <circle cx="114" cy="432" r="5" fill="#a78bfa" opacity=".8"/>
    <circle cx="132" cy="432" r="5" fill="#86efac" opacity=".8"/>
    <rect x="311" y="420" width="278" height="24" rx="12" fill="#09090f" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="450" y="436" text-anchor="middle" fill="#858297" font-size="10">core-course.vercel.app</text>

    <text x="101" y="492" fill="#86efac" font-size="9" letter-spacing="2">● OPEN TO OPPORTUNITIES</text>
    <text x="101" y="531" fill="#f2f0fa" font-size="25" font-weight="700">A place to show</text>
    <text x="101" y="563" fill="url(#accent)" font-size="25" font-weight="700">what you can build.</text>
    <text x="101" y="594" fill="#9b99ad" font-size="11">Thoughtful design, useful details,</text>
    <text x="101" y="612" fill="#9b99ad" font-size="11">and a simple way to connect.</text>
    <rect x="101" y="635" width="118" height="30" rx="8" fill="url(#accent)"/>
    <text x="160" y="654" text-anchor="middle" fill="#20152c" font-size="10" font-weight="700">EXPLORE WORK ↘</text>

    <rect x="478" y="484" width="308" height="207" rx="15" fill="#0c0b13" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="499" y="510" fill="#9b99ad" font-size="9" letter-spacing="1.5">SELECTED PROJECTS</text>
    <rect x="499" y="527" width="266" height="62" rx="10" fill="#171725" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="512" y="540" width="36" height="36" rx="9" fill="#a78bfa" fill-opacity=".16"/>
    <text x="530" y="564" text-anchor="middle" fill="#c4b5fd" font-size="18">◈</text>
    <text x="560" y="550" fill="#f2f0fa" font-size="11" font-weight="700">Project showcase</text>
    <text x="560" y="568" fill="#9b99ad" font-size="9">Filter work by category</text>
    <rect x="499" y="601" width="266" height="62" rx="10" fill="#171725" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="512" y="614" width="36" height="36" rx="9" fill="#f0abfc" fill-opacity=".13"/>
    <text x="530" y="638" text-anchor="middle" fill="#f0abfc" font-size="18">✳</text>
    <text x="560" y="624" fill="#f2f0fa" font-size="11" font-weight="700">Contact &amp; résumé</text>
    <text x="560" y="642" fill="#9b99ad" font-size="9">Connect and learn more</text>

    <text x="68" y="779" fill="#9b99ad" font-size="10" letter-spacing="2.5">BUILT FOR PEOPLE, NOT JUST PIXELS</text>

    <rect x="68" y="807" width="366" height="105" rx="15" fill="#11111b" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="89" y="829" width="38" height="38" rx="11" fill="#a78bfa" fill-opacity=".15"/>
    <text x="108" y="855" text-anchor="middle" fill="#c4b5fd" font-size="19">01</text>
    <text x="144" y="841" fill="#f2f0fa" font-size="14" font-weight="700">Showcase projects</text>
    <text x="144" y="863" fill="#9b99ad" font-size="11">Responsive cards with category filtering.</text>
    <text x="144" y="881" fill="#9b99ad" font-size="11">Visitors can explore work at a glance.</text>

    <rect x="466" y="807" width="366" height="105" rx="15" fill="#11111b" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="487" y="829" width="38" height="38" rx="11" fill="#f0abfc" fill-opacity=".13"/>
    <text x="506" y="855" text-anchor="middle" fill="#f0abfc" font-size="19">02</text>
    <text x="542" y="841" fill="#f2f0fa" font-size="14" font-weight="700">Share a résumé</text>
    <text x="542" y="863" fill="#9b99ad" font-size="11">A one-click download makes experience</text>
    <text x="542" y="881" fill="#9b99ad" font-size="11">easy to access.</text>

    <rect x="68" y="928" width="366" height="105" rx="15" fill="#11111b" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="89" y="950" width="38" height="38" rx="11" fill="#86efac" fill-opacity=".12"/>
    <text x="108" y="976" text-anchor="middle" fill="#86efac" font-size="19">03</text>
    <text x="144" y="962" fill="#f2f0fa" font-size="14" font-weight="700">Make contact</text>
    <text x="144" y="984" fill="#9b99ad" font-size="11">A simple form stores messages for</text>
    <text x="144" y="1002" fill="#9b99ad" font-size="11">follow-up in the admin inbox.</text>

    <rect x="466" y="928" width="366" height="105" rx="15" fill="#11111b" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="487" y="950" width="38" height="38" rx="11" fill="#a78bfa" fill-opacity=".15"/>
    <text x="506" y="976" text-anchor="middle" fill="#c4b5fd" font-size="19">04</text>
    <text x="542" y="962" fill="#f2f0fa" font-size="14" font-weight="700">Manage content</text>
    <text x="542" y="984" fill="#9b99ad" font-size="11">A password-protected dashboard</text>
    <text x="542" y="1002" fill="#9b99ad" font-size="11">manages projects and messages.</text>

    <text x="68" y="1073" fill="#9b99ad" font-size="9" letter-spacing="2">TECH STACK</text>
    <g font-size="10" font-weight="700">
      <rect x="68" y="1090" width="78" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="107" y="1109" text-anchor="middle" fill="#f2f0fa">PYTHON</text>
      <rect x="156" y="1090" width="72" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="192" y="1109" text-anchor="middle" fill="#f2f0fa">FLASK</text>
      <rect x="238" y="1090" width="77" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="276" y="1109" text-anchor="middle" fill="#f2f0fa">HTML/CSS</text>
      <rect x="325" y="1090" width="66" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="358" y="1109" text-anchor="middle" fill="#f2f0fa">JAVASCRIPT</text>
      <rect x="401" y="1090" width="106" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="454" y="1109" text-anchor="middle" fill="#f2f0fa">SQLALCHEMY</text>
      <rect x="517" y="1090" width="75" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="554" y="1109" text-anchor="middle" fill="#f2f0fa">SQLITE</text>
      <rect x="602" y="1090" width="78" height="29" rx="8" fill="#171725" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="641" y="1109" text-anchor="middle" fill="#f2f0fa">VERCEL</text>
    </g>

    <path d="M68 1140h764" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="68" y="1160" fill="#9b99ad" font-size="10">STUDENT PORTFOLIO</text>
    <text x="832" y="1160" text-anchor="end" fill="#c4b5fd" font-size="11" font-weight="700">core-course.vercel.app ↗</text>
  </g>
</svg>
